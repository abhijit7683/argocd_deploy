apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: what
  name: whats-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: what
  template:
    metadata:
      labels:
        app: what
    spec:
      containers:
      - name: what
        image: abhijit7683/whatsapp:latest
        ports:
          - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: what
spec:
  type: LoadBalancer
  selector:
    app: what
  ports:
    - port: 80
      targetPort: 3000
